<!-- ============================================================
     Мобильный top-bar (виден только на узких экранах)
     ============================================================ -->
<header class="mobile-bar">
  <button class="burger" (click)="toggleMenu()" aria-label="Открыть меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="mobile-brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
    </span>
    <span class="mobile-brand-name">Document History</span>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-name">Document</span>
        <span class="brand-sub">History</span>
      </div>
    </div>

    <nav>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Проекты</span>
      </a>

      @if (isAdmin()) {
      <a routerLink="/admin/access" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Доступы</span>
      </a>
      }

      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Профиль</span>
      </a>
    </nav>

    <div class="footer">
      @if (account(); as a) {
      <div class="account-line">
        <span class="dot"></span>
        <div class="account-info">
          <div class="account-name">{{ a.displayName }}</div>
          <div class="account-email">{{ a.email }}</div>
        </div>
      </div>
      <button class="link" (click)="logout()">Сменить аккаунт</button>
      } @else {
      <a class="signin" routerLink="/login" (click)="closeMenu()">Войти</a>
      }
      <div class="version">v{{ version }}</div>
    </div>
  </aside>

  @if (menuOpen()) {
  <div class="sidebar-backdrop" (click)="closeMenu()"></div>
  }

  <main class="content">
    <router-outlet />
  </main>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="13" y2="17"/>
      </svg>
      <span>Document History</span>
    </div>

    <nav>
      <a routerLink="/projects" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Проекты</span>
      </a>
    </nav>

    <div class="footer">
      @if (account(); as a) {
      <div class="account-line">
        <span class="dot"></span>
        <div class="account-info">
          <div class="account-name">{{ a.displayName }}</div>
          <div class="account-email">{{ a.email }}</div>
          <div class="account-tenant">
            <span class="tenant-label">tenant</span>
            <code>{{ a.tenantId }}</code>
          </div>
        </div>
      </div>
      <button class="link" (click)="logout()">Сменить аккаунт</button>
      } @else {
      <a class="signin" routerLink="/login">Войти</a>
      }
      <div class="version">v{{ version }}</div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
